name: Feature request / 功能建议
description: Describe the task you cannot complete today.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do? / 想完成什么任务？
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current workaround / 目前如何解决？
  - type: textarea
    id: acceptance
    attributes:
      label: What would count as a successful change? / 如何判断改进成功？
