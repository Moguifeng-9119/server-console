name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # 只做类型检查/测试/冒烟，不运行 Electron，跳过二进制下载提速
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（src strict + electron checkJs）
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: ESLint and Hooks checks
        run: npm run lint

      - name: e2e 冒烟（双假服务器，真实 SFTP）
        run: npm run smoke

      - name: 生产构建
        run: npm run build

      - name: Install browser for renderer checks
        run: npx playwright-core install --with-deps chromium

      - name: Production renderer smoke (simulated metrics)
        run: npm run test:ui

      - name: File, editor, relay and resume workflow checks
        run: npm run test:workflow

      - name: Window chrome and multilingual layout checks
        run: npm run test:layout

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-checks-${{ matrix.os }}
          path: |
            test-artifacts/ui
            test-artifacts/workflow
            test-artifacts/window-layout
          if-no-files-found: ignore
