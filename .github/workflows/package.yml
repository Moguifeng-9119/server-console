name: Manual desktop packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: dist:win:lite
          - os: ubuntu-latest
            command: dist:linux
          - os: macos-latest
            command: dist:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke
      - run: npm run ${{ matrix.command }}
      - name: Install Linux native runtime dependencies
        if: runner.os == 'Linux'
        run: npx playwright-core install-deps chromium
      - name: Native package checks (Windows/macOS)
        if: runner.os != 'Linux'
        run: node scripts/native-ci.cjs
      - name: Native package checks (Linux with virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/native-ci.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-validation-${{ matrix.os }}
          path: test-artifacts/terminal
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error
