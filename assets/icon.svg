<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景与 UI 主题一致：深海军蓝纵向渐变 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20304f" />
      <stop offset="0.55" stop-color="#14203a" />
      <stop offset="1" stop-color="#0a101d" />
    </linearGradient>
    <!-- 青蓝主色：与 styles.css 的 accent token(#0891b2/#22d3ee) 呼应 -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4de3f7" />
      <stop offset="1" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)" />
  <!-- 细青边：深色任务栏上勾出轮廓 -->
  <rect x="31" y="31" width="450" height="450" rx="106" fill="none" stroke="#22d3ee" stroke-opacity="0.22" stroke-width="6" />

  <!-- 终端提示符 > 与就绪光标 -->
  <path d="M 132 148 L 236 256 L 132 364" fill="none" stroke="url(#accent)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="284" y="340" width="96" height="48" rx="24" fill="#34d399" />

  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#sheen)" />
</svg>
