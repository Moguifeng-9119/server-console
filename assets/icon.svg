<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 浅色底：白到淡蓝灰，与应用默认浅色主题一致 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#e8eff7" />
    </linearGradient>
    <!-- 青蓝提示符：加深一档保证白底对比度 -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4" />
      <stop offset="1" stop-color="#0e7490" />
    </linearGradient>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)" />
  <!-- 细灰边：浅色表面上勾出轮廓 -->
  <rect x="31" y="31" width="450" height="450" rx="106" fill="none" stroke="#0f1b2d" stroke-opacity="0.12" stroke-width="6" />

  <!-- 终端提示符 > 与就绪光标 -->
  <path d="M 132 148 L 236 256 L 132 364" fill="none" stroke="url(#accent)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="284" y="340" width="96" height="48" rx="24" fill="#10b981" />
</svg>
